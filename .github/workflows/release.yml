name: Release

# Every merge to main publishes :latest and a :sha tag, which is what the
# server's systemd timer pulls (spec §12.3). Tags additionally publish a
# version. Deployment is pull-based on purpose: no SSH key in a public repo
# and no inbound path to the home network.
on:
  push:
    branches: [main]
    tags: ["v*"]

# Read-only by default, as everywhere. The one job that needs to write
# packages widens it for itself and nothing else (spec §12.4).
permissions:
  contents: read

# Never let two pushes race to :latest. Not cancel-in-progress: a half-pushed
# manifest is worse than a slow queue.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}-api

jobs:
  image:
    name: build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 is emulated on an amd64 runner. Slow, but the home server may
      # well be a Pi and a wrong-architecture image is useless there.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The job's own short-lived token. No PAT, no stored secret.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=einkaufsliste-api
            org.opencontainers.image.description=Shared shopping list API

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          # The build needs the whole module, so the context is the repository
          # root and the Dockerfile is named explicitly.
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
