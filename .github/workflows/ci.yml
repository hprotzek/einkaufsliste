name: CI

# Plain `pull_request`, never `pull_request_target`. This is a public repo, and
# pull_request_target runs untrusted fork code with a write-scoped token and
# repository secrets in context (spec §12.4).
on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. Widen per job, never here (spec §12.4).
permissions:
  contents: read

# A new push to a PR makes the previous run irrelevant. main is excluded from
# cancellation so every commit that lands keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: vet + golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; leaving the token in .git/config would only
          # widen what a compromised step could reach.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod is the single source of truth for the Go version.
          go-version-file: go.mod

      # golangci-lint runs govet too, but §11.5 names `go vet` as its own gate
      # and it costs seconds. Keeping it separate also means a govet failure is
      # legible without reading linter output.
      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          # Same version file `make lint` reads, so CI and local cannot drift.
          version-file: .golangci-lint-version

  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # §11.5 names frontend typecheck as its own gate. It is what makes the
      # generated API types load-bearing: a contract change that the app has
      # not caught up with fails here.
      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

  stack:
    name: compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Caddy serves web/dist, so the app has to exist before the stack boots.
      - name: Build the web app
        run: make web

      # Derived from .env.example rather than written from scratch, so a
      # variable the stack needs but the example forgets fails here instead of
      # on somebody's first clone. The password is throwaway: this stack lives
      # for ninety seconds on a disposable runner.
      - name: Write .env
        run: |
          cp .env.example .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-not-a-secret|' .env

      # `make up` rather than a hand-written compose line, so CI exercises the
      # command the README documents. It passes --wait, so every container must
      # report healthy, not merely started: Postgres answers pg_isready and the
      # API answers its own probe, which only succeeds once migrations have
      # applied and the listener is open.
      - name: Boot the stack
        run: make up

      # Task 0.7 budgets the image at under 20 MB. Checked here rather than in
      # release.yml because a regression should block the PR that causes it,
      # not surface after merge. Reuses the image `make up` just built.
      - name: Image budget
        run: |
          bytes=$(docker image inspect einkaufsliste-api --format '{{.Size}}')
          budget=$((20 * 1024 * 1024))
          printf 'image size: %s bytes (%s MiB), budget %s MiB\n' \
            "$bytes" "$((bytes / 1024 / 1024))" "$((budget / 1024 / 1024))"
          if [ "$bytes" -ge "$budget" ]; then
            echo "::error::image is $((bytes / 1024 / 1024)) MiB, over the 20 MiB budget"
            exit 1
          fi

      # A scratch image has no shell. Asserting that keeps someone from
      # quietly swapping in alpine to make debugging easier — which would also
      # hand an attacker a shell and break the self-probe rationale.
      - name: Assert the runtime image is really scratch
        run: |
          if docker run --rm --entrypoint /bin/sh einkaufsliste-api -c true 2>/dev/null; then
            echo "::error::the runtime image has a shell, so it is no longer FROM scratch"
            exit 1
          fi
          echo "no shell in the runtime image, as intended"

      - name: Probe /healthz through Caddy
        run: |
          curl --fail --silent --show-error \
               --retry 5 --retry-delay 2 --retry-connrefused \
               http://localhost:8080/healthz

      # Task 0.10's done-when: the app is served by Caddy at the same origin
      # as the API. Both of the previous two steps hitting the same host and
      # port is what "same origin" means here, and is why there is no CORS.
      - name: Serve the web app from the same origin
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost:8080/ > index.html
          grep -q '<div id="root">' index.html \
            || { echo "::error::Caddy did not serve the built app"; cat index.html; exit 1; }
          grep -qE '<script[^>]+src="/assets/' index.html \
            || { echo "::error::served HTML references no built asset bundle"; cat index.html; exit 1; }

      # A deep link must reach the app rather than 404, or client-side routing
      # breaks the moment anyone reloads a page that is not /.
      - name: Deep link falls through to the app
        run: |
          set -euo pipefail
          code=$(curl --silent --output deep.html --write-out '%{http_code}' http://localhost:8080/some/deep/route)
          test "$code" = "200" || { echo "::error::deep link returned $code, expected 200"; exit 1; }
          grep -q '<div id="root">' deep.html \
            || { echo "::error::deep link did not fall through to index.html"; exit 1; }

      # Capture first, then grep. Piping compose straight into grep reports
      # "never migrated" when compose itself failed, which is a check that
      # lies about the thing it is checking.
      - name: Confirm migrations ran inside the container
        run: |
          set -euo pipefail
          docker compose --env-file .env -f infra/docker-compose.yml logs api > api.log
          grep -q '"msg":"schema up to date"' api.log || {
            echo "::error::API never reported the schema as migrated"
            cat api.log
            exit 1
          }

      - name: Container status
        if: always()
        run: make ps

      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/docker-compose.yml logs

      - name: Tear down
        if: always()
        run: make down

  generate:
    name: codegen drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Read pinned sqlc version
        id: sqlc
        run: echo "version=$(cat .sqlc-version)" >> "$GITHUB_OUTPUT"

      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: ${{ steps.sqlc.outputs.version }}

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Catches a query, migration or openapi.yaml edited without
      # regenerating. openapi.yaml is the contract of record, so both sides
      # are regenerated here and compared (non-negotiable 4).
      - name: Regenerate everything
        run: |
          sqlc generate
          go run "github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@$(cat .oapi-codegen-version)" \
            -config api/oapi-codegen.yaml api/openapi.yaml
          npm --prefix web run generate

      - name: Check for drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is out of date. Run 'make generate' and commit the result."
            exit 1
          fi

  test:
    name: go test -race
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres only. Redis was removed from the architecture in spec §5.2,
    # which reverses decision 3 — there is no second service here by design.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: einkaufsliste_test
        ports:
          - 5432:5432
        # The job starts before the container accepts connections without this.
        options: >-
          --health-cmd="pg_isready -U postgres -d einkaufsliste_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Throwaway per-run credentials for a container reachable only from this
      # job. Not a secret, and deliberately not stored as one.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/einkaufsliste_test?sslmode=disable

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # No Go code touches the database yet (tasks 0.4 and 0.5 add it). This
      # step exists so the service container is proven working now, rather
      # than being discovered broken later underneath a real test failure.
      - name: Verify the Postgres service is reachable
        run: |
          pg_isready --host=localhost --port=5432 --username=postgres
          psql "$DATABASE_URL" --no-psqlrc --quiet --command='SELECT version();'

      - name: go test -race
        run: go test -race ./...
