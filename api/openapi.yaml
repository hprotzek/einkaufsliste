# The contract of record (non-negotiable 4). Change this file first, run
# `make generate`, then write code. CI fails if the generated Go or TypeScript
# does not match what this file produces.
#
# 3.0.3 rather than 3.1: oapi-codegen's 3.1 support is still partial, and
# nothing here needs 3.1's type arrays or JSON Schema alignment.
openapi: 3.0.3

info:
  title: Einkaufsliste API
  version: 1.0.0
  description: |
    Shared shopping list for one household.

    Everything under /api/v1 requires a bearer access token (spec §9). Health
    endpoints sit outside that prefix because the uptime ping hits them
    directly (§12.6).

    Errors are RFC 9457 problem+json (§8).

servers:
  # Caddy serves the web app and proxies the API on the same origin, so paths
  # are absolute from the root and there is no CORS (§5.1).
  - url: /

# Applies to every operation; /healthz opts out explicitly.
security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: |
        Reports that the process is running. Deliberately checks no
        dependencies: a database blip must not turn into a restart loop.
      tags: [health]
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/auth/oidc/{provider}/callback:
    post:
      operationId: authCallback
      summary: Exchange an authorisation code for a session
      description: |
        The client completes Authorization Code + PKCE with the provider and
        posts the resulting code here. The server exchanges it, verifies the
        ID token, finds or creates the account, and issues its own tokens —
        the provider's tokens never leave this server (spec §9).

        The refresh token is returned only as an HttpOnly cookie, never in
        the body: JavaScript must not be able to read it (non-negotiable 6).
      tags: [auth]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Provider name. R1 configures Google; nothing assumes it.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCallbackRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The refresh token, HttpOnly, Secure, SameSite=Lax.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/refresh:
    post:
      operationId: authRefresh
      summary: Exchange the refresh cookie for a new session
      description: |
        Reads the refresh token from its cookie and rotates it. Replaying a
        spent token revokes the whole family and ends the session (§9); the
        response does not say which of the two happened.
      tags: [auth]
      security: []
      responses:
        "200":
          description: Rotated.
          headers:
            Set-Cookie:
              description: The replacement refresh token.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      operationId: authLogout
      summary: End this session
      description: |
        Revokes the refresh token's family and clears the cookie. Succeeds
        even when there is no session, so a client can always reach a
        signed-out state.
      tags: [auth]
      security: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: An expired cookie, clearing the refresh token.
              schema:
                type: string

  /api/v1/me:
    get:
      operationId: getMe
      summary: The signed-in user
      description: |
        Returns the authenticated user's profile. Only the fields listed in
        spec §4 are stored: subject, email, display name and avatar URL.
      tags: [users]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An access token issued by this server, never a provider token (§9).
        It is held in memory by the client; the refresh token lives in an
        HttpOnly cookie (non-negotiable 6).

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: Always "ok" — a failing process does not answer at all.
      example:
        status: ok

    AuthCallbackRequest:
      type: object
      required: [code, code_verifier, redirect_uri, nonce]
      properties:
        code:
          type: string
          description: The authorisation code from the provider.
        code_verifier:
          type: string
          description: The PKCE verifier matching the challenge sent to the provider.
        redirect_uri:
          type: string
          description: Must match the redirect URI used to obtain the code.
        nonce:
          type: string
          description: |
            The nonce the client put in the authorize request. The server
            checks the ID token carries the same one, which is what stops an
            ID token captured elsewhere being replayed into this session.

    Session:
      type: object
      required: [access_token, expires_in, user]
      properties:
        access_token:
          type: string
          description: |
            A bearer token for /api/v1. Short-lived and unrevocable, so it is
            held in memory and never in localStorage (non-negotiable 6).
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, display_name, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
          format: email
        avatar_url:
          type: string
          format: uri
          nullable: true
          description: |
            The provider's avatar URL, hotlinked. Null when the provider
            supplied none. Whether these need re-hosting is open (§14b, 5).
        created_at:
          type: string
          format: date-time
          description: UTC, as is everything on the wire (§4).

    Problem:
      type: object
      description: RFC 9457 problem detail.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Unauthorized:
      description: The access token is missing, expired or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NotImplemented:
      description: |
        The endpoint is part of the contract but not yet built. Removed once
        M1 lands authentication.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
